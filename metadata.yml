Identifier: eos9p57
Slug: crem-grow
Status: In progress
Title: CReM Growth-Based Structure Generation
Description: Generates new analogues of an input molecule by attaching a small 
  fragment (1-2 heavy atoms) from a curated ChEMBL fragment database to an 
  available hydrogen position. Every atom and bond of the original structure is 
  preserved intact. Uses the GROW mode of the CReM framework; up to 100 diverse 
  analogues are returned per input via K-Means clustering. Cannot create new 
  ring systems, so ring diversity is limited by the fragment database.
